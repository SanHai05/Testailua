<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lyijykynätöitä</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
:root {
    --nav-width: 350px;
}

.img-a4-vertical { aspect-ratio: 1 / 1.414; object-fit: cover; }
.img-a4-horizontal { aspect-ratio: 1.414 / 1; object-fit: cover; }
.img-square { aspect-ratio: 1 / 1; object-fit: cover; }
.year { text-align: center; margin-top: 10px; font-size: 1.1rem; }
img { border-radius: 0 !important; }

/* 🖥 DESKTOP */
@media (min-width: 992px) {
    body { padding-left: 20px !important; }

    .custom-container {
        max-width: calc(100% - var(--nav-width) - 100px) !important;
        margin-right: var(--nav-width);
        padding-top: 120px;
    }

    .sidebar-column {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        padding-top: 200px;
    }

    .fixed-right-nav {
        position: fixed;
        right: 0;
        top: 0;
        width: var(--nav-width);
        height: 100vh;
        padding-top: 120px;
        padding-left: 120px;
        background-color: white;
        z-index: 1000;
    }

    .fixed-right-nav .nav-link {
        font-size: 1.3rem !important;
        font-weight: 700;
        padding: 10px 0 !important;
        transition: 0.3s;
    }

    .fixed-right-nav .nav-link:hover {
        color: #393433 !important;
    }
}

/* 📱 MOBILE SÄÄDÖT */
@media (max-width: 991px) {
    body {
        padding-top: 30px !important;
        padding-right: 30px;
    }
    .custom-container { padding-top: 0; }
    
    .mobile-nav-fixed {
        position: fixed;
        top: 40px; 
        right: 20px;
        /* Lasketaan z-index arvoon 1000. 
           Bootstrapin offcanvas on 1045, joten se peittää napin. */
        z-index: 1000; 
    }

    /* Lisävarmistus: jos tausta muuttuu tummaksi (backdrop), piilotetaan nappi kokonaan */
    body.offcanvas-open .mobile-nav-fixed {
        visibility: hidden;
    }
}
</style>
</head>

<body class="bg-white">

<div class="mobile-nav-fixed d-lg-none">
    <button class="btn bg-white shadow-sm" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#mobileMenu"
            style="border:1px solid #ddd; padding:10px;">
        <span style="display:block; width:25px; height:3px; background:#333; margin:4px 0;"></span>
        <span style="display:block; width:25px; height:3px; background:#333; margin:4px 0;"></span>
        <span style="display:block; width:25px; height:3px; background:#333; margin:4px 0;"></span>
    </button>
</div>

<div class="container custom-container py-3 py-md-5">

    <div class="row align-items-stretch mb-5">

        <div class="col-12 col-lg-7 order-2 order-lg-1">
            <img src="kuumaa.png" alt="2025 työ" class="img-fluid w-100 img-square">
            <p class="year">2025</p>
        </div>

        <div class="col-12 col-lg-5 ps-lg-5 order-1 order-lg-2">
            <div class="sidebar-column">
                <h1 class="display-5 fw-bold text-center text-lg-center mb-4">LYIJYKYNÄTÖITÄ</h1>
                
                <div class="d-none d-lg-block pb-4 text-center">
                    <img src="silmakuva.jpg" alt="Silmä 2023" class="img-fluid w-100">
                    <p class="year mb-0">2023</p>
                </div>
            </div>
        </div>

    </div>

    <div class="row g-3 g-md-4 align-items-center">
        <div class="col-6 d-lg-none">
            <img src="silmakuva.jpg" alt="Silmä 2023" class="img-fluid img-a4-horizontal">
            <p class="year">2023</p>
        </div>
        <div class="col-6 col-lg-4">
            <img src="harrystyles.png" alt="2022" class="img-fluid img-a4-vertical">
            <p class="year">2022</p>
        </div>
        <div class="col-6 col-lg-4">
            <img src="louistomlinson.png" alt="2023" class="img-fluid img-a4-vertical">
            <p class="year">2023</p>
        </div>
        <div class="col-6 col-lg-4">
            <img src="dylan.png" alt="2024" class="img-fluid img-a4-vertical">
            <p class="year">2024</p>
        </div>
    </div>

</div>

<aside class="fixed-right-nav d-none d-lg-block">
    <nav class="nav flex-column text-start">
        <a class="nav-link text-dark fw-bold px-0" href="#">Etusivu</a>
        <a class="nav-link text-secondary px-0" href="#">Galleria</a>
        <a class="nav-link text-secondary px-0" href="#">Tietoa</a>
        <a class="nav-link text-secondary px-0" href="#">Yhteys</a>
    </nav>
</aside>

<div class="offcanvas offcanvas-end" tabindex="-1" id="mobileMenu">
    <div class="offcanvas-header border-bottom">
        <h5 class="offcanvas-title">Valikko</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
        <nav class="nav flex-column gap-3">
            <a class="nav-link fs-4 text-dark" href="#">Etusivu</a>
            <a class="nav-link fs-4 text-dark" href="#">Galleria</a>
            <a class="nav-link fs-4 text-dark" href="#">Tietoa</a>
            <a class="nav-link fs-4 text-dark" href="#">Yhteys</a>
        </nav>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
