<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyijykynätöitä</title>
    <link rel="stylesheet" href="testi3style.css">
</head>
<body>

    <div class="main-wrapper">
        <div class="top-section">
            <div class="big-img-container">
                <img src="kuumaa.png" alt="2025 työ" class="big-image">
                <p class="year">2025</p>
            </div>

            <div class="sidebar">
                <h1>Lyijykynätöitä</h1>
                <div class="eye-container desktop-only">
                    <img src="silmakuva.jpg" alt="Silmä 2023" class="eye-image">
                    <p class="year">2023</p>
                </div>
            </div>
        </div>

        <div class="bottom-grid">
            <div class="grid-item mobile-only">
                <img src="silmakuva.jpg" alt="Silmä 2023">
                <p class="year">2023</p>
            </div>
            
            <div class="grid-item">
                <img src="harrystyles.png" alt="2022">
                <p class="year">2022</p>
            </div>
            <div class="grid-item">
                <img src="louistomlinson.png" alt="2023">
                <p class="year">2023</p>
            </div>
            <div class="grid-item">
                <img src="dylan.png" alt="2024">
                <p class="year">2024</p>
            </div>
        </div>
    </div>

</body>
</html>
